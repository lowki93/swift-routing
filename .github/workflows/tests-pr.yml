name: Run Tests on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode 26.2
        uses: ./.github/actions/setup-xcode-26-2

      - name: Check README/DocC benefits table are in sync
        run: python3 scripts/check-benefits-table-sync.py

      - name: Run tests
        run: swift test

      - name: Run concurrency tests under ThreadSanitizer
        run: swift test --sanitize=thread --filter ConcurrencyTests
