name: Update Changelog

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_PR_TOKEN }}

      - name: Populate [Unreleased] from merged PRs
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_PR_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"

          # Previous release tag, if any (version-sorted, excluding the tag just pushed).
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            SINCE=$(git log -1 --format=%aI "$PREV_TAG")
          else
            SINCE="1970-01-01T00:00:00Z"
          fi

          gh pr list --state merged --base main --limit 200 \
            --json number,title,body,mergedAt,files \
            --jq "[.[] | select(.mergedAt > \"${SINCE}\")]" > /tmp/merged_prs.json

          python3 - <<'PY'
          import json
          import re

          with open("/tmp/merged_prs.json", encoding="utf-8") as f:
              prs = json.load(f)

          # Oldest first, and only PRs that touched library sources -- Examples/-only PRs
          # (demo app work) aren't notable for consumers of the package.
          prs = [pr for pr in prs if any(fi["path"].startswith("Sources/") for fi in pr["files"])]
          prs.sort(key=lambda pr: pr["mergedAt"])

          SCOPE_SECTIONS = {"docs": "Documentation", "tests": "Tests"}
          TYPE_SECTIONS = {
              "feat": "Added",
              "fix": "Fixed",
              "impr": "Changed",
              "update": "Changed",
              "revert": "Changed",
          }
          SECTION_ORDER = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Documentation", "Tests", "Security"]

          def entry_for(pr):
              title = pr["title"].strip()
              m = re.match(r"^(\w+)\(([^)]*)\):\s*(?:\[[A-Za-z]+-\d+\]\s*)?(.+)$", title)
              pr_type, scope, description = m.groups() if m else ("", "", title)
              section = SCOPE_SECTIONS.get(scope.lower()) or TYPE_SECTIONS.get(pr_type.lower(), "Changed")

              # Prefer the PR body's "**What**:" paragraph -- our PR template already asks for
              # a clear one-paragraph summary there, which reads better than a terse title.
              body = pr.get("body") or ""
              what_match = re.search(
                  r"\*\*What\*\*:\s*\n(.*?)(?:\n\s*\n|\n\*\*Breaking Changes\*\*|\Z)", body, re.DOTALL
              )
              if what_match:
                  text = " ".join(line.strip() for line in what_match.group(1).strip().splitlines() if line.strip())
              else:
                  text = description.strip()

              return section, f"- {text} (#{pr['number']})"

          with open("CHANGELOG.md", encoding="utf-8") as f:
              content = f.read()

          marker = "## [Unreleased]"
          idx = content.find(marker)
          if idx == -1:
              raise SystemExit("No [Unreleased] section found in CHANGELOG.md")

          body_start = idx + len(marker)
          next_release = content.find("\n## [", body_start)
          block_end = next_release if next_release != -1 else len(content)
          block = content[body_start:block_end]

          # Split the Unreleased block into (heading, body) subsections, keeping their order.
          parts = re.split(r"(?m)^(### .+)$", block)
          preamble = parts[0]
          subsections = [[parts[i].strip(), parts[i + 1]] for i in range(1, len(parts), 2)]

          added_count = 0
          for pr in prs:
              # Idempotent: a PR that already got a manually-added entry (per the "add an
              # entry in the same PR" convention) is never duplicated.
              if f"(#{pr['number']})" in content:
                  continue

              section, entry = entry_for(pr)
              heading = f"### {section}"

              for sub in subsections:
                  if sub[0] == heading:
                      # Always leave exactly one trailing blank line before whatever follows.
                      sub[1] = re.sub(r"\n+\Z", "", sub[1]) + f"\n{entry}\n\n"
                      break
              else:
                  target_rank = SECTION_ORDER.index(section) if section in SECTION_ORDER else len(SECTION_ORDER)
                  insert_at = len(subsections)
                  for i, sub in enumerate(subsections):
                      name = sub[0][len("### "):].strip()
                      rank = SECTION_ORDER.index(name) if name in SECTION_ORDER else len(SECTION_ORDER)
                      if rank > target_rank:
                          insert_at = i
                          break
                  subsections.insert(insert_at, [heading, f"\n\n{entry}\n\n"])

              added_count += 1

          new_block = preamble + "".join(h + b for h, b in subsections)
          new_content = content[:idx + len(marker)] + new_block + content[block_end:]

          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"Added {added_count} entr{'y' if added_count == 1 else 'ies'} to [Unreleased]")
          PY

      - name: Close out [Unreleased] section
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          DATE=$(date +%Y-%m-%d)

          python3 - <<PY
          import re
          import sys

          version = "${VERSION}"
          date = "${DATE}"

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          marker = "## [Unreleased]"
          idx = content.find(marker)
          if idx == -1:
              print("No [Unreleased] section found, skipping.")
              print("updated=false")
              sys.exit(0)

          body_start = idx + len(marker)
          next_heading = content.find("\n## [", body_start)
          body_end = next_heading if next_heading != -1 else len(content)
          body = content[body_start:body_end]

          if not body.strip():
              print("Unreleased section is empty, skipping.")
              print("updated=false")
              sys.exit(0)

          new_heading = f"## [Unreleased]\n\n## [{version}] - {date}"
          new_content = content[:idx] + new_heading + body + content[body_end:]

          # Maintain the compare links at the bottom of the file, if present.
          unreleased_link = re.search(
              r"^\[Unreleased\]: (https://\S+/compare/)([^.\s]+(?:\.[^.\s]+)*)\.\.\.HEAD$",
              new_content,
              re.MULTILINE,
          )
          if unreleased_link:
              base_url, previous_version = unreleased_link.groups()
              old_line = unreleased_link.group(0)
              new_unreleased_line = f"[Unreleased]: {base_url}{version}...HEAD"
              new_version_line = f"[{version}]: {base_url}{previous_version}...{version}"
              new_content = new_content.replace(
                  old_line, f"{new_unreleased_line}\n{new_version_line}"
              )

          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"Closed out [Unreleased] as [{version}] - {date}")
          print("updated=true")
          PY

      - name: Update README version references
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"

          python3 - <<PY
          import re

          version = "${VERSION}"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # DocC documentation links: .../swift-routing/X.Y.Z/documentation/...
          content = re.sub(
              r"(https://lowki93\.github\.io/swift-routing/)\d+\.\d+\.\d+(/documentation)",
              rf"\g<1>{version}\g<2>",
              content,
          )

          # SPM install snippet: .upToNextMajor(from: "X.Y.Z")
          content = re.sub(
              r'(\.upToNextMajor\(from: ")\d+\.\d+\.\d+(")',
              rf"\g<1>{version}\g<2>",
              content,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Updated README.md version references to {version}")
          PY

      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_PR_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md README.md; then
            echo "Nothing changed, nothing to do."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME}"
          BRANCH="changelog/${VERSION}"

          # A duplicate workflow run for the same tag (retry, re-delivered webhook, etc.)
          # would otherwise recreate this branch and get a non-fast-forward push rejection
          # against the one a prior run already pushed -- treat that as "already handled".
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists on origin -- a previous run already opened the PR for this tag. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add CHANGELOG.md README.md
          git commit -m "update changelog and README version references for v${VERSION}"
          git push origin "${BRANCH}"

          BODY=$'**What**:\n'"Automated changelog closeout and README version bump for the ${VERSION} release, opened by \`.github/workflows/changelog.yml\`."$'\n\n**Breaking Changes**:\nNone — documentation only.'

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "update(changelog): v${VERSION} release" \
            --body "${BODY}"

          gh pr merge "${BRANCH}" --auto --squash
